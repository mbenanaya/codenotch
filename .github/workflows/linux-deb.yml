name: Linux deb

# Builds the Ubuntu .deb from windows/ (the Tauri port compiles on Linux too) and
# publishes it as a GitHub release. Runs on the fork's `linux` branch only, so a
# Sync fork on `main` never triggers it.
on:
  push:
    branches: [linux]
  workflow_dispatch:

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Build .deb and release
    # 22.04, not latest: the binary links against the runner's glibc, and an older
    # one is what lets the package install on 22.04 and everything newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: linux-deb

      - name: Test
        run: cargo test --locked

      # Own target dir, as in windows-package.yml; tauri.linux.conf.json copies it
      # from there to /usr/bin/codenotch-hook.
      - name: Build the hook
        run: cargo build --release --locked -p codenotch-hook --target-dir target/hook

      - name: Build the deb
        working-directory: windows/codenotch
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles deb -- --locked

      - name: Name and check the deb
        id: deb
        run: |
          version=$(jq -r .version codenotch/tauri.conf.json)
          set -- target/release/bundle/deb/*.deb
          [ $# -eq 1 ] || { echo "expected one .deb, found $#"; exit 1; }
          cp "$1" "Codenotch_${version}.deb"
          dpkg-deb -c "Codenotch_${version}.deb" | grep -E 'usr/bin/codenotch(-hook)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Codenotch_${{ steps.deb.outputs.version }}-${{ github.sha }}
          path: windows/Codenotch_${{ steps.deb.outputs.version }}.deb
          if-no-files-found: error

      # linux-v*, not v*: upstream's v1.26.0 tag (the Mac release) is already in the fork.
      # Re-running for the same version replaces the file instead of failing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.deb.outputs.version }}
        run: |
          tag="linux-v$VERSION"
          file="Codenotch_$VERSION.deb"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" \
              --title "Codenotch $VERSION" \
              --notes "Ubuntu 22.04+ (amd64). Install with: sudo apt install ./$file"
          fi
